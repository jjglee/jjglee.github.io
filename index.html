<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenny Lee</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url("mouse.png") 0 0, auto;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #FFFFFF;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .portfolio-link {
            display: inline-block;
            cursor: url("mouse.png") 0 0, pointer;
        }

        .portfolio-link img {
            width: min(700px, 90vw);
            height: auto;
            display: block;
            transition: transform 0.25s ease;
            cursor: url("mouse.png") 0 0, pointer;
        }

        .portfolio-link:hover img {
            transform: scale(1.06);
        }

        .portfolio-link:active img {
            transform: scale(1.02);
        }
    </style>
</head>

<body>

    <a
        class="portfolio-link"
        href="https://jjglee.wixsite.com/design"
        aria-label="View Jenny Lee's Portfolio">

        <img
            src="jenny-notebook.gif"
            alt="Jenny Lee Notebook">

    </a>

</body>
</html>
