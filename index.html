<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenny Lee</title>

    <!-- Poppins SemiBold -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

            /* Use the custom cursor on EVERYTHING */
            cursor: url("mouse.png") 0 0, auto;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #FFFFFF;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 52px;
            text-align: center;
        }

        .container img {
            width: min(550px, 85vw);
            height: auto;
            display: block;
        }

        .portfolio-btn {
            display: inline-block;
            padding: 16px 48px;
            text-decoration: none;
            background: #FFFFFF;
            color: #000000;
            font-family: 'Poppins', sans-serif;
            font-size: 36px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0;
            border: none;
            transition: color .25s ease;
        }

        .portfolio-btn:hover {
            color: #B9B9B9;
        }
    </style>
</head>

<body>

    <div class="container">

        <img
            src="Jenny-lee-tofu-daisy.gif"
            alt="Jenny Lee and Tofu">

        <a
            class="portfolio-btn"
            href="https://jjglee.wixsite.com/design">
            View My Portfolio
        </a>

    </div>

</body>
</html>
