<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenny Lee</title>

    <!-- Poppins SemiBold -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #FFFFFF;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        img {
            width: min(450px, 80vw);
            height: auto;
            display: block;
        }

        .enter-btn {
            display: inline-block;
            padding: 14px 42px;
            background: #FFFFFF;
            color: #000000;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            font-size: 30px;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0;
            border: none;
            border-radius: 0;
            cursor: pointer;
            transition: color 0.25s ease;
        }

        .enter-btn:hover {
            background: #FFFFFF;
            color: #B9B9B9;
        }
    </style>
</head>

<body>

    <div class="container">

        <img
            src="https://github.com/jjglee/jjglee.github.io/blob/main/jenny-lee.png?raw=true"
            alt="Jenny Lee">

        <a
            class="enter-btn"
            href="https://jjglee.wixsite.com/design">
            View My Portfolio
        </a>

    </div>

</body>
</html>
