<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenny Lee</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #FFFFFF;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
        }

        img {
            width: min(450px, 80vw);
            height: auto;
            display: block;
        }

        .enter-btn {
            display: inline-block;
            padding: 14px 42px;
            text-decoration: none;
            color: #000;
            background: #FFFFFF;
            border: 2px solid transparent;
            border-radius: 999px;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.25s ease;
        }

        .enter-btn:hover {
            border-color: #000000;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="https://github.com/jjglee/jjglee.github.io/blob/main/jenny-tofu.png?raw=true"
             alt="Jenny Lee Illustration">

        <a class="enter-btn"
           href="https://jjglee.wixsite.com/design">
            Enter
        </a>

    </div>

</body>
</html>
